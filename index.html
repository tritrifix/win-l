<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WIN + L</title>
<link id="favicon" rel="icon" href="">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/style.css">

<div id="ecran">
  <div class="stripe" aria-hidden="true"></div>

  <main>
    <div class="contenu">
      <div class="etiquette"><span class="voyant" aria-hidden="true"></span> Poste non verrouillé</div>

      <h1 id="titre">T'as oublié <span class="flash">Win + L</span></h1>

      <div class="touches" aria-hidden="true">
        <div class="touche touche--1 win">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 4.5 11 3.4v8.1H3zM13 3.1 21 2v9.5h-8zM3 12.5h8v8.1L3 19.5zM13 12.5h8V22l-8-1.1z"/></svg>
        </div>
        <div class="plus">+</div>
        <div class="touche touche--2 l">L</div>
      </div>

      <div class="chrono">
        <small>Écran ouvert à tout le bureau depuis</small>
        <b id="compteur">00:00</b>
        <small id="palier"></small>
        <small>Ouvert le <span id="heure">--:--</span></small>
      </div>
    </div>

    <div class="rapport" id="rapport" aria-hidden="true"></div>
    <div class="postit" id="postit" aria-hidden="true">
      Message laissé par toi-même :<br>
      « Je verrouille la prochaine fois, <em>promis</em>. »
      <small id="postit-date"></small>
    </div>
  </main>

  <div class="bandeau" aria-hidden="true"><div class="piste" id="piste"></div></div>
  <div class="stripe bas" aria-hidden="true"></div>
</div>

<div class="pulse" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="retour" id="retour" aria-hidden="true">Ah, te voilà.</div>

<script>
  var debut = Date.now();
  var compteur = document.getElementById('compteur');
  var heure = document.getElementById('heure');
  var palier = document.getElementById('palier');
  var d = new Date();
  function pad(n){ return String(n).padStart(2,'0'); }
  heure.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());

  // Raccourci selon le système. macOS a le sien ; Windows et tout système non
  // reconnu retombent sur Win + L.
  var LOGO_WIN  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 4.5 11 3.4v8.1H3zM13 3.1 21 2v9.5h-8zM3 12.5h8v8.1L3 19.5zM13 12.5h8V22l-8-1.1z"/></svg>';
  var LOGO_COMMAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h6v6H9z"/><path d="M9 9V6.5A2.5 2.5 0 1 0 6.5 9H9z"/><path d="M15 9V6.5A2.5 2.5 0 1 1 17.5 9H15z"/><path d="M9 15v2.5A2.5 2.5 0 1 1 6.5 15H9z"/><path d="M15 15v2.5a2.5 2.5 0 1 0 2.5-2.5H15z"/></svg>';
  var LOGO_CONTROL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15.5 12 8.5l7 7"/></svg>';

  var RACCOURCIS = {
    windows: {
      nom: 'Win + L',
      onglet: 'WIN + L !!!',
      nbTouches: 'Deux touches',
      depuis: '2001',
      indice: 'La touche Windows est en bas à gauche, le L à droite du K',
      touches: [LOGO_WIN, 'L']
    },
    macos: {
      nom: 'Command + Control + Q',
      onglet: 'COMMAND + CONTROL + Q !!!',
      nbTouches: 'Trois touches',
      depuis: 'Mac OS X',
      indice: 'Command borde la barre d\'espace, Control est à sa gauche, le Q en haut du clavier',
      touches: [LOGO_COMMAND, LOGO_CONTROL, 'Q']
    }
  };
  var plateforme = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent || '';
  var raccourci = /mac/i.test(plateforme) ? RACCOURCIS.macos : RACCOURCIS.windows;

  // Les textes portent des jetons plutôt que le raccourci en dur.
  function perso(txt){
    return txt
      .replace(/\{RACCOURCI\}/g, raccourci.nom)
      .replace(/\{NB_TOUCHES\}/g, raccourci.nbTouches)
      .replace(/\{DEPUIS\}/g, raccourci.depuis)
      .replace(/\{INDICE\}/g, raccourci.indice);
  }

  // Touches affichées : un rang par touche, séparées par un +.
  (function(){
    var boite = document.querySelector('.touches');
    boite.innerHTML = '';
    raccourci.touches.forEach(function(contenu, rang){
      if (rang) {
        var plus = document.createElement('div');
        plus.className = 'plus'; plus.textContent = '+';
        boite.append(plus);
      }
      var touche = document.createElement('div');
      touche.className = 'touche touche--' + (rang + 1);
      touche.innerHTML = contenu;
      boite.append(touche);
    });
  })();

  // Titre aléatoire à chaque ouverture
  var titresH1 = [
    ["T'as oublié ", "{RACCOURCI}", ""],
    ["", "{RACCOURCI}", ", c'est pas optionnel"],
    ["Session ouverte. ", "{RACCOURCI}", " aussi ?"],
    ["Ton PC était à tout le monde. ", "{RACCOURCI}", ""],
    ["{NB_TOUCHES}. ", "{RACCOURCI}", ". C'était trop ?"],
    ["Ta session t'attendait. ", "{RACCOURCI}", " aussi."],
    ["Merci pour l'accès. ", "{RACCOURCI}", " la prochaine fois."],
    ["", "{RACCOURCI}", ". Répète après moi."],
    ["Le clavier avait la réponse : ", "{RACCOURCI}", ""],
    ["Pas verrouillé. Pas sérieux. ", "{RACCOURCI}", "."],
    ["", "{RACCOURCI}", " existe depuis {DEPUIS}. Toi, tu découvres."],
    ["Tout le monde a vu ton écran. ", "{RACCOURCI}", "."],
    ["", "{RACCOURCI}", ", ça se tape avec une seule main."],
    ["Ton PC dit merci de l'avoir laissé ouvert. ", "{RACCOURCI}", "."],
    ["Une session ouverte, c'est une invitation. ", "{RACCOURCI}", "."],
    ["", "{RACCOURCI}", ", même la DSI le fait."],
    ["Si t'avais fait ", "{RACCOURCI}", " tu verrais pas ça."],
    ["Le bureau te remercie. ", "{RACCOURCI}", " la prochaine fois."],
  ];
  var choix = titresH1[Math.floor(Math.random() * titresH1.length)];
  var h1 = document.getElementById('titre');
  h1.textContent = '';
  h1.append(perso(choix[0]));
  var flash = document.createElement('span'); flash.className = 'flash'; flash.textContent = perso(choix[1]);
  h1.append(flash, perso(choix[2]));

  // 6. Piques qui tournent, aussi utilisées dans la bande défilante
  var piques = [
    "Session ouverte, constatée par un collègue",
    "Un mail à tous le service était à deux clics",
    "Le fond d'écran a fait l'unanimité contre lui",
    "Ton mot de passe est très bien, dommage qu'il serve à rien",
    "Le PC est en libre-service jusqu'à ton retour",
    "{NB_TOUCHES}. Une seconde. Zéro croissants",
    "{RACCOURCI} ce n'est pas une option, c'est un réflexe",
    "Quelqu'un a peut-être changé ta langue de clavier",
    "Le poste appartient à celui qui passe dans le couloir",
    "Ta session, notre terrain de jeu",
    "Verrouiller, c'est gratuit et ça prend moins d'une seconde",
    "{INDICE}",
    "{RACCOURCI} : la seule combinaison qui protège ta boîte mail",
    "Un poste ouvert, c'est un dossier RH posé sur la table",
    "Ton navigateur connaît tes recherches, nous aussi maintenant",
    "Une session ouverte, c'est une invitation acceptée",
    "Tes onglets ont été passés en revue, deux fois",
    "Tu te lèves, tu verrouilles. Tu reviens, tu déverrouilles. C'est tout",
    "Même ta montre te dirait de verrouiller",
    "Verrouillé en 1 seconde ou ouvert pendant 20 minutes, tu choisis",
    "Le mot de passe, c'est bien. Le taper, c'est mieux",
    "Ce message a été écrit sur ton propre PC",
    "Quelqu'un a réglé ton volume à fond. Ou pas. Tu verras",
    "Ton poste n'a plus de secret pour l'équipe",
    "Poste ouvert : le bureau version buffet à volonté",
    "La DSI appelle ça un incident de sécurité, nous on appelle ça mardi",
    "Un message envoyé depuis ton compte, ça porte quand même ton nom",
    "Ton statut Teams disait absent, ta session disait bienvenue",
    "Cinq minutes à la machine à café, cinq minutes de session ouverte",
    "Tes fichiers partagés étaient accessibles sans mot de passe. Le tien",
    "Une réunion ne dure jamais aussi peu de temps que tu l'imagines"
  ];
  var piste = document.getElementById('piste');
  var texte = piques.map(function(p){ return '<span>' + perso(p) + '</span>'; }).join('');
  piste.innerHTML = texte + texte;   // doublé pour un défilement sans coupure
  // Vitesse constante de 80 px/s quelle que soit la longueur du texte
  function reglerBandeau(){
    var largeur = piste.scrollWidth / 2;
    document.documentElement.style.setProperty('--duree-bandeau', Math.max(20, Math.round(largeur / 80)) + 's');
  }
  reglerBandeau();
  window.addEventListener('resize', reglerBandeau);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reglerBandeau);

  // Messages qui montent avec le temps (secondes, texte)
  var paliers = [
    [0,    "Personne n'a encore rien vu. Enfin, presque."],
    [30,   "Trente secondes. Quelqu'un a déjà lu tes onglets."],
    [60,   "Une minute. Ça fait long, une minute."],
    [120,  "Deux minutes. Ton fond d'écran a été jugé."],
    [300,  "Cinq minutes. Tout ton bureau est passé devant."],
    [600,  "Dix minutes. On aurait pu envoyer un mail à ta place."],
    [900,  "Un quart d'heure. Ton mot de passe ne sert plus à rien."],
    [1800, "Trente minutes. À ce stade c'est un poste en libre-service."],
    [3600, "Une heure. Le poste appartient à l'équipe maintenant."],
    [5400, "Une heure et demie. On a eu le temps de changer ton fond d'écran deux fois."],
    [7200, "Deux heures. Tu es parti manger ou déménager ?"],
    [10800, "Trois heures. Le poste a vu plus de collègues que toi aujourd'hui."]
  ];
  var palierActuel = -1, timerPique = null, indexPique = Math.floor(Math.random() * piques.length);
  function afficherLigne(txt){
    palier.textContent = perso(txt);
    palier.classList.remove('change'); void palier.offsetWidth; palier.classList.add('change');
  }
  function relancerPiques(){
    clearInterval(timerPique);
    timerPique = setInterval(function(){
      indexPique = (indexPique + 1) % piques.length;
      afficherLigne(piques[indexPique] + '.');
    }, 20000);
  }
  function majPalier(s){
    var idx = 0;
    for (var k = 0; k < paliers.length; k++) if (s >= paliers[k][0]) idx = k;
    if (idx !== palierActuel) {
      palierActuel = idx;
      afficherLigne(paliers[idx][1]);
      relancerPiques();
    }
  }

  // Fond qui vire au rouge sombre en 10 minutes, et 12. rayures qui changent aux paliers
  function majFond(s){
    var t = Math.min(s / 600, 1);
    var r = Math.round(11 + (92 - 11) * t), g = Math.round(10 - 2 * t), b = 8;
    document.documentElement.style.setProperty('--fond', 'rgb(' + r + ',' + g + ',' + b + ')');
    var bande = s >= 600 ? '#e5261b' : s >= 300 ? '#ff8a1f' : '#ffd21f';
    document.documentElement.style.setProperty('--bande', bande);
  }

  var affichage = '';
  function rendreChrono(txt){
    if (txt.length !== affichage.length) {
      compteur.textContent = '';
      for (var c = 0; c < txt.length; c++) {
        var el = document.createElement('span');
        el.className = txt[c] === ':' ? 'sep' : 'chiffre';
        el.textContent = txt[c];
        compteur.appendChild(el);
      }
    } else {
      for (var c2 = 0; c2 < txt.length; c2++) {
        if (txt[c2] !== affichage[c2]) {
          var cell = compteur.children[c2];
          cell.textContent = txt[c2];
          cell.classList.remove('bascule'); void cell.offsetWidth; cell.classList.add('bascule');
        }
      }
    }
    affichage = txt;
  }
  function tick(){
    var s = Math.floor((Date.now() - debut) / 1000);
    var h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
    rendreChrono((h ? pad(h)+':' : '') + pad(m) + ':' + pad(sec));
    majPalier(s); majFond(s);
    if (s >= 120) document.getElementById('postit').classList.add('visible');
  }
  tick(); setInterval(tick, 500);

  // Compteur d'ouvertures de la semaine sur ce poste, sert au numéro d'incident (une ouverture max toutes les 10 min)
  (function(){
    var n = 1;
    try {
      var now = new Date();
      var lundi = new Date(now); lundi.setHours(0,0,0,0); lundi.setDate(lundi.getDate() - ((lundi.getDay() + 6) % 7));
      var cle = 'winl-' + lundi.toISOString().slice(0,10);
      var data = JSON.parse(localStorage.getItem(cle) || '{"n":0,"t":0}');
      if (Date.now() - data.t > 600000) { data.n += 1; data.t = Date.now(); localStorage.setItem(cle, JSON.stringify(data)); }
      n = data.n || 1;
    } catch (e) {}
    // 5. Rapport d'incident
    var jours = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
    var numero = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + '-' + pad(n);
    var poste = (navigator.platform || 'PC').replace(/win32/i, 'Windows').replace(/macintel/i, 'macOS') + ' \u00B7 ' + screen.width + '\u00D7' + screen.height;
    document.getElementById('rapport').innerHTML =
      'Incident <b>n\u00B0 ' + numero + '</b><br>' +
      'Poste <b>' + poste + '</b><br>' +
      'Constaté <b>' + jours[d.getDay()] + ' à ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + '</b><br>' +
      'Par <b>un collègue</b> \u00B7 Suite : <b>' + raccourci.nom + '</b>';

    // 4. Date sur le mot laissé par la victime
    document.getElementById('postit-date').textContent =
      'Signé le ' + pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear() + ' à ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ', sur ce poste.';
  })();

  // 9. Glitch sur le titre toutes les 10 secondes
  setInterval(function(){
    h1.classList.remove('glitch'); void h1.offsetWidth; h1.classList.add('glitch');
  }, 10000);

  // Titre + icône d'onglet qui clignotent
  var titres = ['⚠ POSTE NON VERROUILLÉ', raccourci.onglet, '⚠ SESSION OUVERTE'];
  var icones = [
    "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='#ffd21f'/><path d='M16 4 3 28h26z' fill='#0b0a08'/><rect x='14.5' y='12' width='3' height='8' fill='#ffd21f'/><circle cx='16' cy='23.5' r='1.8' fill='#ffd21f'/></svg>"),
    "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='#e5261b'/><rect x='7' y='15' width='18' height='13' rx='2' fill='#fbf6e6'/><path d='M19 15v-5a5 5 0 0 1 10 0v2' fill='none' stroke='#fbf6e6' stroke-width='3'/></svg>")
  ];
  var favicon = document.getElementById('favicon');
  var i = 0;
  favicon.href = icones[0];
  setInterval(function(){
    i++;
    document.title = titres[i % titres.length];
    favicon.href = icones[i % icones.length];
  }, 900);

  // Plein écran : tentative au chargement, puis au premier geste
  function pleinEcran(){
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function(){});
  }
  pleinEcran();
  document.body.addEventListener('click', pleinEcran);
  document.addEventListener('pointerdown', pleinEcran, { once: true });

  // Curseur caché après 2,5 s sans bouger. Chrome renvoie des mousemove quand un élément animé passe
  // sous le pointeur : on ignore si la position n'a pas changé.
  var timerCurseur = null, dernierX = null, dernierY = null;
  function cacherBientot(){
    document.documentElement.classList.remove('sans-curseur');
    clearTimeout(timerCurseur);
    timerCurseur = setTimeout(function(){ document.documentElement.classList.add('sans-curseur'); }, 2500);
  }

  // 4. Détection de retour : après 20 s d'immobilité, un vrai déplacement (40 px ou plus) ou une touche déclenche le flash
  var reposX = null, reposY = null, dernierGeste = Date.now();
  var retour = document.getElementById('retour');
  var SEUIL_PX = 40, SEUIL_MS = 20000;
  function gesteReel(){
    var maintenant = Date.now();
    if (maintenant - dernierGeste >= SEUIL_MS) {
      retour.classList.remove('actif'); void retour.offsetWidth; retour.classList.add('actif');
    }
    dernierGeste = maintenant;
  }
  document.addEventListener('mousemove', function(e){
    if (e.clientX === dernierX && e.clientY === dernierY) return;
    dernierX = e.clientX; dernierY = e.clientY;
    cacherBientot();
    if (reposX === null) { reposX = e.clientX; reposY = e.clientY; dernierGeste = Date.now(); return; }
    var dx = e.clientX - reposX, dy = e.clientY - reposY;
    if (Math.hypot(dx, dy) >= SEUIL_PX) { gesteReel(); reposX = e.clientX; reposY = e.clientY; }
  });
  cacherBientot();

  // Alarme sonore : sirène deux tons. Secousse et rayures rapides suivent la classe .alarme
  var ctx = null, osc = null, gain = null, sirene = null;
  function demarrerSon(){
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    osc = ctx.createOscillator(); gain = ctx.createGain();
    osc.type = 'square'; gain.gain.value = 0.08;
    osc.connect(gain).connect(ctx.destination);
    osc.frequency.value = 660;
    osc.start();
    var haut = true;
    sirene = setInterval(function(){ haut = !haut; osc.frequency.setValueAtTime(haut ? 660 : 440, ctx.currentTime); }, 400);
    document.body.classList.add('alarme');
  }
  function arreterSon(){
    if (sirene) clearInterval(sirene);
    if (osc) { try { osc.stop(); } catch(e){} }
    osc = null; sirene = null;
    document.body.classList.remove('alarme');
  }
  function basculerSon(){ if (osc) arreterSon(); else demarrerSon(); }

  // Raccourcis : S = sirène, Échap coupe la sirène, toute autre touche tente le plein écran
  document.addEventListener('keydown', function(e){
    // Bloque F12, Ctrl+Shift+I/J/C, Ctrl+U
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && /^[ijc]$/i.test(e.key)) || (e.ctrlKey && /^u$/i.test(e.key))) {
      e.preventDefault(); return;
    }
    gesteReel();
    if (e.key === 'Escape') { if (osc) arreterSon(); return; }
    if (/^s$/i.test(e.key)) { basculerSon(); return; }
    pleinEcran();
  });
  // Pas de clic droit
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('pointerdown', gesteReel);

  // Confirmation avant de fermer l'onglet
  window.addEventListener('beforeunload', function(e){
    e.preventDefault();
    e.returnValue = 'Tu pars sans verrouiller ?';
    return e.returnValue;
  });
</script>
